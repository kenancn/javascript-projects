<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Animated Expanding Cards</title>
</head>
<body>
    <div class="main"><h1>Animated Expanding Cards</h1></div>
    <div class="container">
        <div class="panel active" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ec/Logo_de_Audi_.jpg');">
        <h3>Audi</h3>
        </div>
        <div class="panel" style="background-image: url('https://wallpaperaccess.com/full/1124994.jpg');">
            <h3>Bmw</h3>
        </div>
        <div class="panel" style="background-image: url('https://cdn.motor1.com/images/mgl/xWk8k/s1/mercedes-benz-social-distancing-logo.webp');">
            <h3>Mercedes</h3>
        </div>
        <div class="panel" style="background-image: url('https://papers.co/wallpaper/papers.co-af30-tesla-motors-logo-art-29-wallpaper.jpg');">
            <h3>Tesla</h3>
        </div>
        <div class="panel" style="background-image: url('https://gkpb.com.br/wp-content/uploads/2021/09/novo-logo-volvo-scaled.jpg');">
            <h3>Volvo</h3>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
